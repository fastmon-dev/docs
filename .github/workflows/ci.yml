name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # `if: always()` so the typecheck still runs (and reports) even when an
      # earlier check fails — we want both signals from a single run rather
      # than fail-fast hiding the type errors behind a lint error.
      - run: npm run types:check
        if: always()

  build:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # `npm run build` runs `generate:api` first, which fetches the public
      # OpenAPI spec from https://api.fastmon.eu/v1/openapi.json. If that
      # endpoint is down, this step fails — by design, since deploying a
      # build with stale API docs would silently ship outdated reference.
      - run: npm run build
