name: Security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC. Catches advisories published since last run.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify package-lock.json is in sync with package.json
        run: npm ci --ignore-scripts

      - name: npm audit
        run: npm audit --audit-level=high

  osv-scan:
    # Supplementary scan via Google's OSV-Scanner. OSV.dev aggregates GitHub
    # Advisory DB, npm advisories etc. into one schema, so this job covers
    # package-lock.json + GitHub Actions SHAs in a single pass. Runs alongside
    # (not instead of) npm audit: broader advisory coverage at the cost of
    # more noise. Severity is not filtered; ignores live in osv-scanner.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json
